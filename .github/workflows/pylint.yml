name: Lint Python code with pylint

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - mcm/**/*.py
  push:
    paths:
      - mcm/**/*.py

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r ./mcm/requirements.txt

      - name: Run pylint
        run: |
          pylint $(git ls-files -- '*.py' ':(exclude)mcv/**')
