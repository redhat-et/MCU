name: MCV Example Image Build

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: ["*"]
    paths:
      - mcv/**
      - .github/workflows/mcv-build-example-images.yml
  push:
    branches: [main]
    paths:
      - mcv/**
      - .github/workflows/mcv-build-example-images.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: quay.io
  ORG: gkm
  REPO: cache-examples
  COSIGN_YES: "true"
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build example cache images with MCV container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Setup Docker
        uses: docker/setup-docker-action@v4
        with:
          set-host: true

      - name: Set push flag
        id: set-push
        run: |
          if [ ${{ github.event_name }} == 'push' ] && [ ${{ github.repository_owner }} == 'redhat-et' ]; then
            echo "push_flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_flag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to quay.io (Docker)
        if: ${{ fromJSON(steps.set-push.outputs.push_flag) }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Pull MCV builder image
        run: docker pull quay.io/gkm/mcv:latest

      - name: Build images inside MCV container and load to host
        env:
          REGISTRY: ${{ env.REGISTRY }}
          ORG: ${{ env.ORG }}
          REPO: ${{ env.REPO }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${REGISTRY}/${ORG}/${REPO}"
          out_dir="${GITHUB_WORKSPACE}/.mcv-out"
          mkdir -p "${out_dir}"

          # tag|relative_context_dir (relative to repo root)
          images=(
            "vector-add-cache-rocm|mcv/example/vector-add-cache-rocm"
            "vector-add-cache-cuda|mcv/example/vector-add-cache"
            "vllm-example|mcv/example/vllm-cache"
          )

          for e in "${images[@]}"; do
            IFS="|" read -r tag reldir <<<"${e}"
            image="${repo}:${tag}"
            tar="${out_dir}/${tag}.tar"

            echo "==> Building ${image} using MCV container from /work/${reldir}"
            docker run --rm --privileged \
              -e TAG="${tag}" \
              -e IMAGE="${image}" \
              -e RELDIR="${reldir}" \
              -v "${GITHUB_WORKSPACE}:/work:rw" \
              quay.io/gkm/mcv:latest bash -lc '
                set -euo pipefail
                /mcv -l info -c -i "$IMAGE" -d "/work/$RELDIR"
                buildah push "containers-storage:$IMAGE" "docker-archive:/work/.mcv-out/$TAG.tar:$IMAGE"
              '

            echo "==> Loading ${tar} into host docker"
            docker load -i "${tar}"
          done

      - name: Push & sign images
        if: ${{ fromJSON(steps.set-push.outputs.push_flag) }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          ORG: ${{ env.ORG }}
          REPO: ${{ env.REPO }}
          COSIGN_YES: "true"
        shell: bash
        run: |
          set -euo pipefail
          repo="${REGISTRY}/${ORG}/${REPO}"
          images=(vector-add-cache-rocm vector-add-cache-cuda vllm-example)
          for tag in "${images[@]}"; do
            img="${repo}:${tag}"
            echo "==> Pushing ${img}"
            docker push "${img}"
            echo "==> Signing ${img}"
            cosign sign "${img}"
          done
