name: MCV Example Image Build

on:
  pull_request:
    branches: ["*"]
    paths:
      - mcv/**
      - .github/workflows/mcv-build-example-images.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # needed for keyless cosign
  packages: write

env:
  REGISTRY: quay.io
  ORG: gkm
  REPO: cache-examples
  COSIGN_YES: "true"        # auto-confirm cosign
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Make build (mcv)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Setup Docker
        uses: docker/setup-docker-action@v4
        with:
          set-host: true
          # version: v27.4.0
          # daemon-config: |
          #   { "debug": true }

      - name: Install required system packages for mcv
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpgme-dev libbtrfs-dev
      - name: Login to quay.io (Docker)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Prepare vendored dependencies
        working-directory: mcv
        run: |
          go mod tidy
          go mod vendor

      - name: Build with Makefile
        run: make mcv

      - name: Install mcv
        run: make mcv-install

      - name: Build, sign, and push example images (Docker)
        env:
          REGISTRY: ${{ env.REGISTRY }}
          ORG: ${{ env.ORG }}
          REPO: ${{ env.REPO }}
          COSIGN_YES: ${{ env.COSIGN_YES }}
          CONTAINER_ENGINE: docker
        shell: bash
        run: |
          set -euo pipefail

          repo="${REGISTRY}/${ORG}/${REPO}"

          images=(
            "vector-add-cache-rocm|vector-add-cache-rocm|mcv/example/vector-add-cache-rocm"
            "vector-add-cache-cuda|vector-add-cache-cuda|mcv/example/vector-add-cache"
            "vllm-example|vllm-example|mcv/example/vllm-cache"
          )

          for entry in "${images[@]}"; do
            IFS="|" read -r _ tag dir <<<"${entry}"
            image="${repo}:${tag}"

            echo "==> Creating ${image} from ${dir}"
            mcv -c -i "${image}" -d "${dir}" -l debug

            echo "==> Pushing ${image}"
            docker push "${image}"

            echo "==> Signing ${image}"
            cosign sign "${image}"

            echo "==> Done: ${image}"
          done
